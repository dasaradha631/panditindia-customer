name: Build iOS IPA

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          PROJECT_ROOT=$(pwd)
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "$PROJECT_ROOT/build/app-release.ipa" Payload
          cd "$PROJECT_ROOT"
          ls -la build/app-release.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-ios-ipa
          path: build/app-release.ipa
          if-no-files-found: error
          retention-days: 30
